<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escaparazzi</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-1: #08121f;
      --bg-2: #203b63;
      --frame: rgba(244, 241, 222, 0.16);
      --text: #f4f1de;
      --muted: #97cee3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(255, 214, 74, 0.18), transparent 30%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 760px);
      padding: 20px;
    }

    .frame {
      padding: 20px;
      border: 1px solid var(--frame);
      border-radius: 18px;
      background: rgba(5, 10, 18, 0.68);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.35);
    }

    .title {
      margin: 0 0 12px;
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
    }

    .stage {
      display: grid;
      place-items: center;
      padding: 14px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.24);
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      border: 4px solid rgba(244, 241, 222, 0.18);
      background: #000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
  <script>
    window.EscaparazziAssetsBase = '/assets';
    window.EscaparazziBootState = {
      errors: [],
      markReady: function () {
        document.documentElement.setAttribute('data-boot-state', 'ready');
        document.documentElement.setAttribute('data-boot-errors', this.errors.join(' | '));
      },
      markError: function (message) {
        this.errors.push(message || 'Unknown boot error');
        document.documentElement.setAttribute('data-boot-state', 'error');
        document.documentElement.setAttribute('data-boot-errors', this.errors.join(' | '));
      }
    };

    document.documentElement.setAttribute('data-boot-state', 'loading');
    document.documentElement.setAttribute('data-boot-errors', '');

    window.addEventListener('error', function (event) {
      window.EscaparazziBootState.markError(event.message);
    });

    window.addEventListener('unhandledrejection', function (event) {
      var reason = event.reason;
      var message = reason && reason.message ? reason.message : String(reason || 'Unhandled rejection');

      window.EscaparazziBootState.markError(message);
    });
  </script>
  <script src="lib/game/core/game-config.js"></script>
  <script src="lib/game/core/game-phase.js"></script>
  <script src="lib/game/core/input-snapshot.js"></script>
  <script src="lib/game/core/rng.js"></script>
  <script src="lib/game/core/game-state.js"></script>
  <script src="lib/game/core/tick.js"></script>
  <script src="lib/impact/impact.js"></script>
  <script src="lib/game/main.js"></script>
</head>
<body>
  <main>
    <section class="frame">
      <h1 class="title">Escaparazzi</h1>
      <p class="subtitle">A faithful first playable of the Flash game running at the original 320x240 resolution with 2x presentation, reusing the checked-in <code>/assets</code> directly.</p>
      <div class="stage">
        <canvas id="canvas"></canvas>
      </div>
    </section>
  </main>
</body>
</html>
